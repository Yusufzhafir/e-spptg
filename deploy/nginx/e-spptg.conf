# E-SPPTG — nginx di HOST (AlmaLinux 10), bukan di dalam Docker.
# Pasang di: /etc/nginx/conf.d/e-spptg.conf
#
# Publik hanya 80/443. Aplikasi (container) di 127.0.0.1:3000, MinIO di 127.0.0.1:9000.
#
# SELinux: nginx tidak boleh connect ke upstream sampai boolean ini dinyalakan:
#   sudo setsebool -P httpd_can_network_connect 1
#
# TLS: sertifikat WILDCARD instansi di /opt/certs/ (fullchain.pem + privkey.pem).
# Label SELinux /opt/certs harus cert_t, kalau tidak nginx gagal baca file:
#   sudo semanage fcontext -a -t cert_t "/opt/certs(/.*)?"
#   sudo restorecon -Rv /opt/certs

upstream espptg_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream espptg_minio {
    server 127.0.0.1:9000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# HTTP: hanya redirect ke HTTPS (sertifikat wildcard dikelola manual oleh tim infra,
# tidak ada ACME challenge yang perlu dilayani di sini)
# ---------------------------------------------------------------------------
server {
    listen 80;
    # Aktifkan kalau host punya IPv6:
    # listen [::]:80;
    server_name siaptah.kutaitimurkab.go.id 103.222.254.244;

    location / {
        return 301 https://siaptah.kutaitimurkab.go.id$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    http2 on;
    server_name siaptah.kutaitimurkab.go.id;

    # Sertifikat wildcard instansi (*.kutaitimurkab.go.id) di /opt/certs.
    # fullchain.pem harus berisi sertifikat + seluruh intermediate CA.
    ssl_certificate     /opt/certs/fullchain.pem;
    ssl_certificate_key /opt/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dua hal yang menentukan batas ini:
    #   - Upload dokumen maksimal 10 MB, dikirim base64 lewat tRPC (~1.34x).
    #   - Impor massal kawasan mengirim geometri per batch. Kawasan Non-SPPTG
    #     tidak dibatasi ukurannya (satu kawasan pada SK provinsi bisa 781 blok
    #     / 444.000 titik ~ 17 MB JSON), dan batch yang memuatnya dikirim utuh
    #     dalam satu request. 20m akan menolaknya di tepi; 64m memberi ruang.
    client_max_body_size 64m;
    client_body_timeout  300s;

    access_log /var/log/nginx/e-spptg.access.log;
    error_log  /var/log/nginx/e-spptg.error.log;

    # -----------------------------------------------------------------------
    # Object storage (MinIO) — path publik = /<nama-bucket>/...
    #
    # Presigned URL SigV4 menandatangani host + path. Karena itu:
    #   - path TIDAK boleh di-rewrite (tanpa trailing slash di proxy_pass)
    #   - Host header diteruskan apa adanya supaya tanda tangan tetap valid
    # Ganti "spptg-files" kalau S3_BUCKET_NAME berbeda.
    # -----------------------------------------------------------------------
    location /spptg-files/ {
        proxy_pass http://espptg_minio;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload/download objek besar: jangan di-buffer nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 20m;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # -----------------------------------------------------------------------
    # Aset statis Next.js — immutable, aman di-cache lama
    # -----------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://espptg_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -----------------------------------------------------------------------
    # Aplikasi
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://espptg_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Lokasi pengunjung hanya boleh datang dari proxy tepercaya, tidak pernah
        # dari klien. src/app/api/kunjungan/route.ts membaca header-header ini apa
        # adanya (CF-* diprioritaskan) lalu menyimpannya ke page_visits.negara/kota,
        # jadi tanpa baris ini siapa pun bisa mengarang lokasinya sendiri.
        # nginx TIDAK meneruskan header yang nilainya string kosong — jadi ini
        # menghapusnya, bukan mengirim nilai kosong (yang akan tersimpan sebagai '').
        # Kalau nanti GeoIP2 dipasang, ganti nilai "" di dua baris X-Geo-* dengan
        # $geoip2_country_code / $geoip2_city_name; dua baris CF-* tetap dikosongkan.
        proxy_set_header CF-IPCountry      "";
        proxy_set_header CF-IPCity         "";
        proxy_set_header X-Geo-Country     "";
        proxy_set_header X-Geo-City        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        # Generate PDF SPPTG & cek overlap PostGIS bisa lama.
        proxy_read_timeout    300s;
    }
}

# Diperlukan proxy_set_header Connection $connection_upgrade di atas.
# Kalau blok map ini sudah ada di nginx.conf lain, hapus dari sini.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
